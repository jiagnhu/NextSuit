server {
    listen 80;
    server_name studio.tangyikai.top;

    client_max_body_size 10m;

    # Optional: let root go to suite homepage.
    location = / {
        return 302 /nextsuit;
    }

    # API routes (external: /nextsuit/api/v1/* -> internal: /api/v1/*)
    location = /nextsuit/api/v1 {
        proxy_pass http://127.0.0.1:18640/api/v1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /nextsuit/api/v1/ {
        proxy_pass http://127.0.0.1:18640/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files (external: /nextsuit/uploads/* -> internal: /uploads/*)
    location = /nextsuit/uploads {
        proxy_pass http://127.0.0.1:18640/uploads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /nextsuit/uploads/ {
        proxy_pass http://127.0.0.1:18640/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Blog app (Next.js)
    location = /nextsuit/blog {
        proxy_pass http://127.0.0.1:18633;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /nextsuit/blog/ {
        proxy_pass http://127.0.0.1:18633;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Admin app (static dist served by Nginx)
    location = /nextsuit/admin {
        return 301 /nextsuit/admin/;
    }

    location ^~ /nextsuit/admin/assets/ {
        alias /www/wwwroot/studio.tangyikai.top/NextSuit/apps/admin-web/dist/assets/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ^~ /nextsuit/admin/ {
        alias /www/wwwroot/studio.tangyikai.top/NextSuit/apps/admin-web/dist/;
        try_files $uri $uri/ /nextsuit/admin/index.html;
    }

    # Marketing app (Next.js)
    location = /nextsuit {
        proxy_pass http://127.0.0.1:18632;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /nextsuit/ {
        proxy_pass http://127.0.0.1:18632;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
