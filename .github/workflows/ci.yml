name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nextsuit/api prisma:generate

      - name: Typecheck all apps
        run: |
          pnpm typecheck:api
          pnpm typecheck:admin
          pnpm typecheck:marketing
          pnpm typecheck:blog

      - name: Build all apps
        run: |
          pnpm build:api
          pnpm build:admin
          pnpm build:marketing
          pnpm build:blog
