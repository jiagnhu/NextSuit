<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dataBg" x1="0" y1="0" x2="1400" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F9FF" />
      <stop offset="1" stop-color="#F8FFF7" />
    </linearGradient>
    <marker id="dataArrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L0 6L9 3L0 0Z" fill="#4B6885" />
    </marker>
    <style>
      .title { font: 700 28px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #17314D; }
      .sub { font: 500 16px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #47627D; }
      .node-title { font: 700 18px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #17324F; }
      .node-line { font: 500 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #304A65; }
      .entity { font: 700 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #2B4762; }
      .mini { font: 500 12px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #486582; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1399" height="759" rx="24" fill="url(#dataBg)" stroke="#D6E3F2" />
  <text x="52" y="56" class="title">Unified Data Flow Across 4 Projects</text>
  <text x="52" y="84" class="sub">Marketing Web + Blog Web + Admin Web -> Core API -> PostgreSQL (single source of truth)</text>

  <rect x="56" y="130" width="288" height="168" rx="16" fill="#FFFFFF" stroke="#CDDEEF" />
  <text x="78" y="166" class="node-title">Marketing Web</text>
  <text x="78" y="192" class="node-line">POST /contacts</text>
  <text x="78" y="212" class="node-line">POST /leads</text>
  <text x="78" y="232" class="node-line">POST /subscribers</text>
  <text x="78" y="252" class="node-line">GET /settings/public</text>

  <rect x="56" y="332" width="288" height="168" rx="16" fill="#FFFFFF" stroke="#CDDEEF" />
  <text x="78" y="368" class="node-title">Blog Web</text>
  <text x="78" y="394" class="node-line">GET /articles</text>
  <text x="78" y="414" class="node-line">GET /articles/:slug</text>
  <text x="78" y="434" class="node-line">GET /categories + /tags</text>
  <text x="78" y="454" class="node-line">POST /page-views</text>

  <rect x="56" y="534" width="288" height="168" rx="16" fill="#FFFFFF" stroke="#CDDEEF" />
  <text x="78" y="570" class="node-title">Admin Web</text>
  <text x="78" y="596" class="node-line">GET /dashboard/overview</text>
  <text x="78" y="616" class="node-line">GET /leads /contacts /subscribers</text>
  <text x="78" y="636" class="node-line">Article CRUD + upload image</text>
  <text x="78" y="656" class="node-line">PATCH status / add activity</text>

  <rect x="434" y="224" width="430" height="392" rx="18" fill="#FFFFFF" stroke="#C7DBEE" />
  <text x="458" y="264" class="node-title">Core API Service (Express + Prisma)</text>

  <rect x="458" y="288" width="186" height="88" rx="12" fill="#F8FCFF" stroke="#D8E7F6" />
  <text x="472" y="319" class="entity">Auth + Org Context</text>
  <text x="472" y="340" class="mini">JWT session, org slug middleware</text>

  <rect x="654" y="288" width="186" height="88" rx="12" fill="#F8FCFF" stroke="#D8E7F6" />
  <text x="668" y="319" class="entity">CRM Modules</text>
  <text x="668" y="340" class="mini">Leads / Contacts / Subscribers</text>

  <rect x="458" y="390" width="186" height="88" rx="12" fill="#F8FCFF" stroke="#D8E7F6" />
  <text x="472" y="421" class="entity">Content Modules</text>
  <text x="472" y="442" class="mini">Articles / Categories / Tags</text>

  <rect x="654" y="390" width="186" height="88" rx="12" fill="#F8FCFF" stroke="#D8E7F6" />
  <text x="668" y="421" class="entity">Analytics Modules</text>
  <text x="668" y="442" class="mini">Page views + dashboard stats</text>

  <rect x="458" y="492" width="382" height="88" rx="12" fill="#F8FCFF" stroke="#D8E7F6" />
  <text x="472" y="523" class="entity">Shared API Capabilities</text>
  <text x="472" y="544" class="mini">Server pagination, search, filtering, validation, audit fields</text>

  <rect x="952" y="252" width="392" height="336" rx="18" fill="#FFFFFF" stroke="#C7DBEE" />
  <text x="978" y="294" class="node-title">PostgreSQL Data Layer</text>

  <rect x="978" y="320" width="150" height="74" rx="10" fill="#F8FCFF" stroke="#D8E7F6" />
  <text x="992" y="350" class="entity">users / roles</text>
  <text x="992" y="369" class="mini">admin permissions</text>

  <rect x="1144" y="320" width="174" height="74" rx="10" fill="#F8FCFF" stroke="#D8E7F6" />
  <text x="1158" y="350" class="entity">articles / tags</text>
  <text x="1158" y="369" class="mini">content entities</text>

  <rect x="978" y="408" width="150" height="74" rx="10" fill="#F8FCFF" stroke="#D8E7F6" />
  <text x="992" y="438" class="entity">contacts / leads</text>
  <text x="992" y="457" class="mini">sales pipeline</text>

  <rect x="1144" y="408" width="174" height="74" rx="10" fill="#F8FCFF" stroke="#D8E7F6" />
  <text x="1158" y="438" class="entity">subscribers</text>
  <text x="1158" y="457" class="mini">email audience</text>

  <rect x="978" y="496" width="340" height="74" rx="10" fill="#F8FCFF" stroke="#D8E7F6" />
  <text x="992" y="526" class="entity">page_views / analytics_summary / settings</text>
  <text x="992" y="545" class="mini">dashboard and public site runtime data</text>

  <line x1="344" y1="214" x2="434" y2="290" stroke="#4B6885" stroke-width="2.5" marker-end="url(#dataArrow)" />
  <line x1="344" y1="416" x2="434" y2="420" stroke="#4B6885" stroke-width="2.5" marker-end="url(#dataArrow)" />
  <line x1="344" y1="618" x2="434" y2="540" stroke="#4B6885" stroke-width="2.5" marker-end="url(#dataArrow)" />

  <line x1="864" y1="420" x2="952" y2="420" stroke="#4B6885" stroke-width="2.8" marker-end="url(#dataArrow)" />
  <line x1="952" y1="542" x2="864" y2="542" stroke="#7B94AD" stroke-width="2" marker-end="url(#dataArrow)" />

  <text x="52" y="732" class="sub">Traceable proof: every form submission and content action is persisted and can be reviewed in Admin Web.</text>
</svg>
